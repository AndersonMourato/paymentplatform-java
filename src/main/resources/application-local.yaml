spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_platform
    username: payment_user
    password: payment_pass
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus